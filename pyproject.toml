[project]
name = "imzdesk"
version = "0.0.5"
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Open-source workbench for Whole-Slide Imaging (WSI) and Mass Spectrometry Imaging (MSI) visualization, co-registration, and dataset curation."
keywords = [
    "spatial metabolomics",
    "mass spectrometry imaging",
    "whole slide imaging",
    "image registration",
    "histopathology",
    "dataset curation",
    "medical imaging",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.138.0",
    "h5py>=3.16.0",
    "huggingface-hub>=1.23.0",
    "lxml>=6.1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "openslide-python>=1.4.6",
    "pillow>=12.1.0",
    "psutil>=7.2.2",
    "pydantic-settings>=2.13.4",
    "pydantic>=2.13.4",
    "pyimzml>=1.5.5",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "simpleitk>=2.3.1",
    "starlette>=1.3.1",
    "tqdm>=4.68.4",
    "uvicorn[standard]>=0.48.0"
]

[project.urls]
Homepage = "https://med-i-lab.gitbook.io/imzdesk"
Documentation = "https://med-i-lab.gitbook.io/imzdesk"
Repository = "https://github.com/aryan-f/imzDesk"
Issues = "https://github.com/aryan-f/imzDesk/issues"
Changelog = "https://github.com/aryan-f/imzDesk/releases"

[project.optional-dependencies]
extras = [
    "safetensors>=0.8.0",
    "torchvision~=0.27.1",
    "torch~=2.12.1",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132" }]
torchvision = [{ index = "pytorch-cu132" }]

[project.scripts]
imzdesk = "imzdesk.server.entry:run_server"

[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: slow tests",
    "requires_openslide: requires native OpenSlide/libopenslide",
    "requires_data: requires external image data",
    "requires_torch: requires torch/model dependencies",
]
filterwarnings = [
    "ignore:Accession .* found with incorrect name.*:UserWarning",
]

[tool.coverage.run]
omit = [
    "src/imzdesk/__main__.py",
    "src/imzdesk/server/*",
    "src/imzdesk/server/**/*",
    "src/imzdesk/transforms/models/dreams.py",
]

[tool.setuptools.packages.find]
where = ["src"]
